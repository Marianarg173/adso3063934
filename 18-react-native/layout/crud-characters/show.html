<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohana - View Character</title>
    <!-- Ruta corregida saliendo de la carpeta con ../ -->
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <div class="phone-container characters-view-page" style="display: flex;">

        <div class="header-blue-title">
            VIEW CHARACTER <img src="../img/stic_view.png" class="header-stitch-avatar">
        </div>

        <div class="char-back-navigation">
            <a href="../characters.html"><img src="../img/regre.png" alt="Back"></a>
        </div>

        <div class="char-avatar-view-container">
            <img src="../img/stich_c.png" id="char-img" class="char-profile-circle-img">
        </div>

        <div class="char-technical-sheet">
            <div class="technical-sheet-title">Information</div>

            <div class="sheet-row-item">
                <span class="sheet-label">ID:</span>
                <span class="sheet-value" id="char-id">3</span>
            </div>
            <div class="sheet-row-item">
                <span class="sheet-label">Name:</span>
                <span class="sheet-value" id="char-name">Stitch</span>
            </div>
            <div class="sheet-row-item">
                <span class="sheet-label">Kinds:</span>
                <span class="sheet-value" id="char-kind">Experiment</span>
            </div>
        </div>

        <div class="char-description-viewer">
            <span class="viewer-title">Description</span>
            <p class="viewer-content" id="char-desc">Genetic experiment created by Dr. Jumba</p>
        </div>

        <div class="char-action-buttons single-alignment">
            <a href="../characters.html" class="btn-char-dismiss long-version"
                style="text-decoration: none; text-align: center;">Cancel</a>
        </div>

        <!-- Menú Inferior Fijo (Rutas apuntando afuera con ../) -->
        <div class="bottom-navbar">
            <a href="../dashboard.html" class="nav-item">
                <img src="../img/das.png" alt="Dashboard">
            </a>
            <a href="../profile.html" class="nav-item">
                <img src="../img/profile.png" alt="Profile">
            </a>
            <a href="../characters.html" class="nav-item active">
                <img src="../img/characters.png" alt="Characters">
            </a>
            <a href="../kinds.html" class="nav-item">
                <img src="../img/kind.png" alt="Kinds">
            </a>
        </div>
    </div>

    <script>
        (function(){
            const chars = {
                '1': {id:1, name:'Lilo', kind:'Humans', desc:'A brave young girl from Hawaii', img:'../img/lilo.png'},
                '2': {id:2, name:'Nani', kind:'Humans', desc:'Lilo\'s older sister and caretaker', img:'../img/nani.png'},
                '3': {id:3, name:'Stitch', kind:'Experiment', desc:'Genetic experiment created by Dr. Jumba', img:'../img/stich_c.png'},
                '4': {id:4, name:'Pleakley', kind:'Alien', desc:'An expert on Earth cultures', img:'../img/pleakley.png'}
            };
            const url = new URL(window.location.href);
            const id = url.searchParams.get('id') || '3';
            const data = chars[id] || chars['3'];
            document.getElementById('char-id').textContent = data.id;
            document.getElementById('char-name').textContent = data.name;
            document.getElementById('char-kind').textContent = data.kind;
            document.getElementById('char-desc').textContent = data.desc;
            document.getElementById('char-img').src = data.img;
        })();
    </script>

</body>

</html>
