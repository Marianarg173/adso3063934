<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohana - View Kind</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <div class="phone-container characters-view-page" style="display: flex;">

        <div class="header-blue-title">
            VIEW KIND <img src="../img/stic_view.png" class="header-stitch-avatar">
        </div>

        <div class="char-back-navigation">
            <a href="../kinds.html"><img src="../img/regre.png" alt="Back"></a>
        </div>

        <div class="char-avatar-view-container">
            <img src="../img/villain.png" id="kind-img" class="char-profile-circle-img">
        </div>

        <div class="char-technical-sheet">
            <div class="technical-sheet-title">Information</div>

            <div class="sheet-row-item">
                <span class="sheet-label">ID:</span>
                <span class="sheet-value" id="kind-id">4</span>
            </div>
            <div class="sheet-row-item">
                <span class="sheet-label">Name:</span>
                <span class="sheet-value" id="kind-name">villain</span>
            </div>
        </div>

        <div class="char-description-viewer">
            <span class="viewer-title">Description</span>
            <p class="viewer-content" id="kind-desc">Chaos personified. A character designed to break the rules....</p>
        </div>

        <div class="char-action-buttons single-alignment">
            <a href="../kinds.html" class="btn-char-dismiss long-version"
                style="text-decoration: none; text-align: center;">Cancel</a>
    
        </div>

        <div class="bottom-navbar">
            <a href="../dashboard.html" class="nav-item">
                <img src="../img/das.png" alt="Dashboard">
            </a>
            <a href="../profile.html" class="nav-item">
                <img src="../img/profile.png" alt="Profile">
            </a>
            <a href="../characters.html" class="nav-item">
                <img src="../img/characters.png" alt="Characters">
            </a>
            <a href="../kinds.html" class="nav-item active">
                <img src="../img/kind.png" alt="Kinds">
            </a>
        </div>
    </div>

    <script>
        (function(){
            const kinds = {
                '1': {id:1, name:'Humans', desc:'Human species', img:'../img/lilo.png'},
                '2': {id:2, name:'Alien', desc:'Extraterrestrial beings', img:'../img/alien.png'},
                '3': {id:3, name:'Experiment', desc:'Genetic experiments', img:'../img/experiment.png'},
                '4': {id:4, name:'Villain', desc:'Chaos personified. A character designed to break the rules', img:'../img/villain.png'}
            };
            const url = new URL(window.location.href);
            const id = url.searchParams.get('id') || '4';
            const data = kinds[id] || kinds['4'];
            document.getElementById('kind-id').textContent = data.id;
            document.getElementById('kind-name').textContent = data.name;
            document.getElementById('kind-desc').textContent = data.desc;
            document.getElementById('kind-img').src = data.img;
        })();
    </script>

</body>

</html>
