<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohana App - Login</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quintessential&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="phone-container login-page">

        <a href="index.html" class="back-arrow">
            <img src="img/regreso.png" alt="Regresar">
        </a>

        <div class="welcome-logo-section">
            <img src="img/logo.png" alt="Ohana Logo" class="logo-img">
        </div>

        <div class="login-card">
            <h2 class="login-card-title">LOGIN IN</h2>

            <form action="#" method="POST" class="login-form">

                <div class="input-group">
                    <div class="icon-circle user-circle">
                        <img src="img/user.png" alt="User">
                    </div>
                    <input type="text" placeholder="Username" required>
                </div>

                <div class="input-group password-group">
                    <input type="password" placeholder="Password" required>
                    <div class="icon-circle lock-circle">
                        <img src="img/password.png" alt="Lock">
                    </div>
                </div>

                <div class="welcome-actions-section">
                    <a href="dashboard.html" class="btn-welcome login">Login</a>
                </div>
                <div class="forgot-link" style="text-align:center; margin-top:8px;">
                    <a href="forgot.html" style="color:#8feaec; text-decoration:none;">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>

        <div class="login-image-section">
            <img src="img/stich.png" alt="Stitch Sitting" class="stitch-login-img">
        </div>

    </div>

</body>

</html>
