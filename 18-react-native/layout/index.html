<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohana App - Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quintessential&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="phone-container">
        
        <div class="welcome-logo-section">
            <img src="img/logo.png" alt="Ohana Logo" class="logo-img">
        </div>

        <div class="welcome-image-section">
            <img src="img/logo2.png" alt="Stitch Character" class="stitch-welcome-img">
        </div>

        <div class="welcome-text-section">
            <h2 class="welcome-title">Welcome to OHANA</h2>
            <p class="welcome-description">
                Your smart and friendly interface system. Create your account to start your adventure or log in to continue exploring.
            </p>
        </div>

        <div class="welcome-actions-section">
            <a href="login.html" class="btn-welcome login">Login</a>
            <a href="register.html" class="btn-welcome register">Register</a>
        </div>

    </div>

</body>
</html>
